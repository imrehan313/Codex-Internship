# .github/workflows/main.yml

name: Build and Test

on: [push] 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Use a specific version for stability

    # ----------------------------------------------------------------
    # FIX: Installation step MUST come before the script runs
    # ----------------------------------------------------------------
    - name: Install dependencies
      # This command assumes requirements.txt is in the root
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt 
    
    # ----------------------------------------------------------------
    # RUN THE SCRIPT
    # ----------------------------------------------------------------
    - name: Run Python Script with Secrets
      env:
        WEATHER_KEY: ${{ secrets.WEATHER_API_KEY }}
        NEWS_KEY: ${{ secrets.NEWS_API_KEY }} # Corrected spacing here 

      run: |
        echo "Starting script execution..."
        # Running the script
        python voice.py 
        
    - name: Display a simple message
      run: echo "The workflow ran successfully!"

    # REMOVE THE REDUNDANT INSTALL STEP HERE (It was at the end before)
